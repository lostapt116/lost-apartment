    <main>
        <h1>聯絡我們</h1>
        <form class="contact-form" id="contact-form">
            <div class="form-row">
                <label for="name">姓名</label>
                <input class="fill-name" type="text" name="name" placeholder="姓名" required>
                <label for="phone">電話</label>
                <input class="fill-phone" type="tel" name="phone" placeholder="電話">
            </div>
            <label for="email">電子信箱</label>
            <input class="fill-email" type="email" name="email" placeholder="電子信箱" required>
            <label for="message">想告訴我們的話</label>
            <textarea class="fill-message" name="message" placeholder="歡迎留下您的想法⋯⋯" rows="8"></textarea>
            <div class="form-buttons">
                <button type="reset" class="btn btn-clear">清除</button>
                <button type="submit" class="btn btn-submit">送出</button>
            </div>
        </form>

        <!-- hidden 屬性是瀏覽器內建的，等於 display: none，不用另外寫 CSS -->
        <div class="form-success" hidden>
            <p>訊息已送出，我們會盡快回覆您！</p>
        </div>
</div>
